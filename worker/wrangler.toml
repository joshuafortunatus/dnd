name = "ddb-character-proxy"
main = "ddb-character-proxy.js"
compatibility_date = "2026-07-25"

[[kv_namespaces]]
binding = "PORTAL_DATA"
id = "ab521a5271844f5e8bc2f168221205ca"

# Verified working as a real deploy mechanism: `npx wrangler login` once,
# then `npx wrangler r2 bucket create <bucket_name>` to create the bucket
# and `npx wrangler deploy` (run from this worker/ directory) to push the
# code and apply both bindings below in one shot -- no dashboard paste-in
# required (that manual path, documented in this Worker's own header
# comment, still works too, just isn't the only option anymore). If you
# rename the bucket, update bucket_name here to match.
[[r2_buckets]]
binding = "PORTAL_FILES"
bucket_name = "dnd-portal-files"
