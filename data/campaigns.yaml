# Every campaign synced from a Google Sheet. To add a new campaign:
#
#   1. Create a Google Sheet for text content, using the "that's fair" sheet
#      as a template — one tab per type: sessions, quests, lore,
#      notable_actions, characters, locations, skills_check_guide, misc. See
#      scripts/sync_sheet.py's docstring for each tab's expected columns.
#   2. Share the sheet as a Viewer with the sync service account
#      (client_email in your GOOGLE_CREDENTIALS_JSON secret).
#   3. Add an entry below with the sheet's ID (from its URL:
#      https://docs.google.com/spreadsheets/d/<id>/edit).
#   4. Scaffold the campaign page: hugo new campaigns/<slug>/_index.md
#      (fill in hero_image with a real image under
#      static/images/campaigns/<slug>/).
#
# That's it — the next sync (daily cron, or running scripts/sync_sheet.py
# locally) picks up the new campaign automatically. The ID isn't sensitive,
# so it lives here rather than as a secret; the GOOGLE_CREDENTIALS_JSON
# service account key is the only real secret.
#
# campaigns:
#   - slug: my-campaign
#     sheet_id: "1AbCdEfGhIjKlMnOpQrStUvWxYz"
campaigns:
  - slug: thats-fair
    sheet_id: "1OU8-uEP_AfjVd3GNaNi2hSVjVspmW9kLXzJzHNeux6U"
